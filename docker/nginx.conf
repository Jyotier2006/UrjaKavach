# Serves the Next.js static export. Runs unprivileged on 8080 so the pod needs no root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be served stale, or clients pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The export writes directories with trailing slashes; fall back to 404.html to match the SPA shell.
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

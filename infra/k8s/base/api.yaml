apiVersion: apps/v1
kind: Deployment
metadata:
  name: urjakavach-api
  labels:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: urjakavach
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urjakavach
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: urjakavach-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: urjakavach-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urjakavach-secrets
                  key: DATABASE_URL
            # Optional integrations. The API starts without them, so they are not required to exist.
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: urjakavach-secrets
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: urjakavach-secrets
                  key: SENTRY_DSN
                  optional: true
          # CP-SAT scheduling is CPU-bound and bursty, so the limit sits well above the request.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # db.py falls back to SQLite under .state when DATABASE_URL is absent, and the root filesystem is
            # read-only, so give it somewhere writable.
            - name: state
              mountPath: /app/.state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: urjakavach-api
  labels:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urjakavach-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urjakavach-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: urjakavach-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urjakavach
      app.kubernetes.io/component: api

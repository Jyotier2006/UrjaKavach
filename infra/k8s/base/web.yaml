apiVersion: apps/v1
kind: Deployment
metadata:
  name: urjakavach-web
  labels:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: urjakavach
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urjakavach
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Static export served by nginx. The API address is baked in at image build time, so changing the
          # backend means rebuilding this image rather than editing an environment variable here.
          image: urjakavach-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: urjakavach-web
  labels:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: urjakavach
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
